name: CI

on:
  push:
    branches: [main, ver_gpt]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r server/requirements-dev.txt
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/extension/core.test.js tests/extension/outbox.test.js tests/extension/discard.test.js tests/extension/offscreen_discard.test.js
      - run: for file in extension/*.js; do node --check "$file"; done
